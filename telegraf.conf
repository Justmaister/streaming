[global_tags]

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"

[[outputs.influxdb_v2]]
  urls = ["http://172.31.242.201:8282"]
  token ="apiv3_hrm7SLpPrTOo04LNIbkX2jkZoq48Y3xhfbu7g1O87P19jZDcjachfPFbLlfpiUvGsx7iZiiOgRxmsws3_8spgQ"
  organization = ""
  bucket = "Influxdb_bucket"
  timeout = "20s"

[[inputs.opcua]]
  name = "opcua_sensor_1"
  endpoint = "opc.tcp://127.0.0.1:4840"
  security_policy = "None"
  auth_method = "Anonymous"
  interval = "5s"

  [[inputs.opcua.nodes]]
    name = "Temperature_1"
    namespace = "2"
    identifier_type = "s"
    identifier = "Temperature_1"

  [[inputs.opcua.nodes]]
    name = "Wind_1"
    namespace = "2"
    identifier_type = "s"
    identifier = "Wind_1"

  [[inputs.opcua.nodes]]
    name = "N-01"
    namespace = "2"
    identifier_type = "s"
    identifier = "N-01"

[[inputs.opcua]]
  name = "opcua_sensor_2"
  endpoint = "opc.tcp://127.0.0.1:4840"
  security_policy = "None"
  auth_method = "Anonymous"
  interval = "5s"

  [[inputs.opcua.nodes]]
    name = "Temperature_2"
    namespace = "2"
    identifier_type = "s"
    identifier = "Temperature_2"

  [[inputs.opcua.nodes]]
    name = "Wind_2"
    namespace = "2"
    identifier_type = "s"
    identifier = "Wind_2"

  [[inputs.opcua.nodes]]
    name = "N-02"
    namespace = "2"
    identifier_type = "s"
    identifier = "N-02"

[[processors.converter]]
  [processors.converter.fields]
    float = [
      "Temperature_1",
      "Wind_1",
      "N-01",
      "Temperature_2",
      "Wind_2",
      "N-02"
    ]